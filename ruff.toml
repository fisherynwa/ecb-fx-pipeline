target-version = "py312"
exclude = ["dbt/target", "dbt/dbt_packages", ".venv"]

[lint]
# E/F: pycodestyle + pyflakes errors, I: import order, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# The app adds the project folder to sys.path before importing from it
"app/streamlit_app.py" = ["E402"]
