# Airflow for this project: ONE container running "airflow standalone"
# (scheduler, API server and DAG processor in one process, SQLite as its database).
# Fine on one machine; a production setup splits these into separate services.
#
#   docker compose up -d --build     start (first time: builds the image)
#   http://localhost:8090            the Airflow UI
#   docker compose down              stop

services:
  airflow:
    build: ./airflow
    image: ecb-fx-pipeline-airflow:3.3.2
    command: standalone
    ports:
      - "8090:8080"  # 8090 on your computer, leaving 8080 free
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Europe/Berlin
      # Local use only: no login, everyone is admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Keep dbt's generated files inside the container, out of your project folder
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs
    volumes:
      - ./airflow/dags:/opt/airflow/dags  # the DAG files
      - .:/opt/project                    # the whole project: code, config, dbt, data
